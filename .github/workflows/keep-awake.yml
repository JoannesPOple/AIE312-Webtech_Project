# Render's free plan sleeps after ~15 minutes without traffic, so the first chat
# message after a quiet spell waits 30-60s for a cold start. Pinging the health
# endpoint every 10 minutes keeps the backend awake.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --max-time 90 https://team-ai-portfolio-api.onrender.com/api/health
