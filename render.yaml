services:
  - type: web
    name: team-ai-portfolio-api
    runtime: node
    plan: free
    rootDir: BE
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false # you paste this in the Render dashboard; never commit it
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CLIENT_URL
        value: https://joannespople.github.io,http://localhost:5173
